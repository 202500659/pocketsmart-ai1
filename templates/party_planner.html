<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Party Planner - PocketSmart AI</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <nav class="navbar">
        <h2>PocketSmart AI</h2>
        <div><a href="/dashboard">Dashboard</a><a href="/history">History</a></div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Party Budget Planner</h2>
            <form id="partyForm">
                <div class="form-group">
                    <label>Total Budget (₹)</label>
                    <input type="number" id="total_budget" required value="25000">
                </div>
                <div class="card-grid">
                    <div class="form-group">
                        <label>Party Type</label>
                        <input type="text" id="party_type" required value="Birthday Party">
                    </div>
                    <div class="form-group">
                        <label>Number of Guests</label>
                        <input type="number" id="num_guests" required value="20">
                    </div>
                </div>
                <div class="form-group">
                    <label>Venue Type</label>
                    <input type="text" id="venue_type" value="Rented Hall / Home">
                </div>
                <div class="form-group">
                    <label>Services Needed:</label>
                    <input type="checkbox" id="needs_catering" checked> Catering
                    <input type="checkbox" id="needs_decoration" checked> Decoration
                    <input type="checkbox" id="needs_entertainment" checked> Entertainment
                </div>
                <button type="submit" class="btn">Plan Event</button>
            </form>
        </div>

        <div id="loading" style="display:none; margin-top:2rem; text-align:center;">
            <h3>Allocating party budget and searching vendors...</h3>
        </div>

        <div id="results" style="margin-top:2rem;"></div>
    </div>

    <script>
        document.getElementById('partyForm').onsubmit = async (e) => {
            e.preventDefault();
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').innerHTML = '';

            const payload = {
                total_budget: parseFloat(document.getElementById('total_budget').value),
                party_type: document.getElementById('party_type').value,
                num_guests: parseInt(document.getElementById('num_guests').value),
                venue_type: document.getElementById('venue_type').value,
                needs_catering: document.getElementById('needs_catering').checked,
                needs_decoration: document.getElementById('needs_decoration').checked,
                needs_entertainment: document.getElementById('needs_entertainment').checked
            };

            const res = await fetch('/party-budget', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            document.getElementById('loading').style.display = 'none';

            if (res.ok) {
                const data = await res.json();
                let html = `<div class="card"><h3>Party Plan Summary</h3>
                            <p><strong>Budget:</strong> ₹${data.total_budget}</p>`;
                
                (data.budget_breakdown || []).forEach(cat => {
                    html += `<h4>${cat.category}</h4><table class="results-table">
                            <tr><th>Item/Service</th><th>Details</th><th>Price</th><th>Search Vendors</th></tr>`;
                    (cat.items || []).forEach(item => {
                        let links = '';
                        if(item.shopping_links) {
                            for(let [p, url] of Object.entries(item.shopping_links)) {
                                links += `<a href="${url}" target="_blank" class="badge-link">${p}</a>`;
                            }
                        }
                        html += `<tr><td>${item.name}</td><td>${item.description}</td><td>₹${item.estimated_price}</td><td>${links}</td></tr>`;
                    });
                    html += `</table>`;
                });
                html += `</div>`;
                document.getElementById('results').innerHTML = html;
            }
        };
    </script>
</body>
</html>
