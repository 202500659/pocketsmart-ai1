<!DOCTYPE html><html><head><title>Login</title>
<style>body{font-family:Arial;display:flex;justify-content:center;padding:50px} form{border:1px solid #ccc;padding:30px;border-radius:15px;width:350px} input{width:100%;padding:10px;margin:10px 0} button{width:100%;padding:12px;background:#00b894;color:white;border:none;border-radius:8px}</style>
</head><body>
<form method="post" action="/login">
<h2>Login</h2>
<input type="text" name="username" placeholder="Username" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Login</button>
<p>No account? <a href="/register">Create Account</a></p>
</form>
</body></html>
